version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - MODEL_DIR=/app/models/exported_model
      - CORS_ORIGINS=*
    volumes:
      - ./models/exported_model:/app/models/exported_model
    restart: unless-stopped

  trainer:
    build:
      context: .
      dockerfile: models/Dockerfile
    profiles:
      - training
    volumes:
      - ./models/exported_model:/app/exported_model
