version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
        VITE_WS_URL_LOCAL: ${VITE_WS_URL_LOCAL}
        VITE_WS_URL_PROD: ${VITE_WS_URL_PROD}
    ports:
      - "80:80"
    restart: unless-stopped
    depends_on:
      - backend
    # Make sure we load the env variables during build or runtime
    # For Vite, build time envs are needed, so we pass them as args if needed
    # But as a simple setup, env_file works for runtime.
    env_file:
      - .env

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - MODEL_DIR=/app/models/exported_model
      - CORS_ORIGINS=*
    volumes:
      - ./models/exported_model:/app/models/exported_model
    restart: unless-stopped

  trainer:
    build:
      context: .
      dockerfile: models/Dockerfile
    profiles:
      - training
    env_file:
      - .env
    volumes:
      - ./models/exported_model:/app/exported_model
