# Netlify configuration for ExpresaT frontend (React + Vite)

[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback for React Router DOM
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Optional same-origin WebSocket proxy to FastAPI backend
# [[redirects]]
#   from = "/ws/*"
#   to = "wss://api.expresat.cloud/ws/:splat"
#   status = 200
#   force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Allow camera access for MediaPipe gesture recognition
    Permissions-Policy = "camera=(self), microphone=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

