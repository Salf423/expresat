plugins {
    id 'com.android.application'
}

android {
    compileSdk 34
    namespace 'com.expresat.native_app'

    defaultConfig {
        applicationId "com.expresat.native_app"
        minSdk 26          // API 26 = Android 8.0 (Camera2 NDK requirement)
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        ndk {
            abiFilters "arm64-v8a"
        }

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared",
                          "-DBUILD_DESKTOP=OFF",
                          "-DBUILD_ANDROID=ON",
                          "-DONNXRUNTIME_ROOT=${projectDir}/libs/onnxruntime"
                cppFlags "-std=c++17"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "../CMakeLists.txt"    // Points to root CMakeLists.txt
            version "3.24.0+"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
        debug {
            debuggable true
            jniDebuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets']
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'

    def camerax_version = "1.3.1"
    implementation "androidx.camera:camera-core:${camerax_version}"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"

    implementation fileTree(dir: 'libs', include: ['*.aar', '*.jar'])
}

// Download ONNX Runtime AAR for local development
task downloadOnnxRuntime {
    def version = "1.19.2"
    def url = "https://github.com/microsoft/onnxruntime/releases/download/v${version}/onnxruntime-android-${version}.aar"
    def dest = file("libs/onnxruntime-android-${version}.aar")

    doLast {
        if (!dest.exists()) {
            mkdir 'libs'
            new URL(url).withInputStream { is ->
                dest << is
            }
            println "ONNX Runtime ${version} downloaded to ${dest}"
        } else {
            println "ONNX Runtime already exists: ${dest}"
        }
    }
}

// Copy ONNX model to assets
task copyModelToAssets(type: Copy) {
    from "${project.rootDir}/../models/exported_model/expresat_gru_float32.onnx"
    into "src/main/assets"
    onlyIf {
        file("${project.rootDir}/../models/exported_model/expresat_gru_float32.onnx").exists()
    }
}

preBuild.dependsOn copyModelToAssets
