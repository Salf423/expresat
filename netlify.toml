# ==============================================================================
# Netlify Configuration - Root Repository Level
# ==============================================================================

[build]
  # Ubicación del módulo frontend desde la raíz del repositorio Git
  base = "expresat/frontend"
  
  # Comando de compilación de Vite
  command = "npm run build"
  
  # Carpeta generada por Vite (relativa a base: expresat/frontend/dist)
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# ------------------------------------------------------------------------------
# Redirección SPA para React Router DOM
# ------------------------------------------------------------------------------
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ------------------------------------------------------------------------------
# Cabeceras de Seguridad y Permisos
# ------------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
