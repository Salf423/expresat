name: Train, Verify & Export Model (v1.4.0)

on:
  push:
    paths:
      - 'expresat/models/feature_extractor.py'
      - 'expresat/models/train_and_export.py'
      - 'expresat/models/inference_engine.py'
      - 'expresat-dataset-generator/scripts/**'
      - 'catalog/signs_catalog.json'
      - '.github/workflows/train_model.yml'
  pull_request:
    paths:
      - 'expresat/models/**'
      - 'expresat-dataset-generator/scripts/**'
      - 'tests/**'
      - '.github/workflows/train_model.yml'
  workflow_dispatch:
    inputs:
      manifest_path:
        description: 'Path to real Stage-2 manifest.json (leave empty for CI smoke-test only)'
        required: false
        default: ''
      epochs:
        description: 'Training epochs'
        required: false
        default: '40'
      min_macro_f1:
        description: 'Minimum validation Macro-F1 gate for real datasets'
        required: false
        default: '0.85'

jobs:
  verify-and-smoke-ablation:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python ML dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install onnx onnxruntime numpy jsonschema

      - name: Run full v1.4.0 contract and training unit test suite
        env:
          PYTHONPATH: expresat
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Run A/B smoke-test ablation in temporary directory (never committed)
        env:
          PYTHONPATH: expresat
        run: |
          SMOKE_DIR="${{ runner.temp }}/expresat_ci_smoke"
          rm -rf "$SMOKE_DIR"
          python expresat/models/train_and_export.py \
            --allow-synthetic-smoke-test \
            --ablation \
            --epochs 18 \
            --benchmark-runs 100 \
            --output "$SMOKE_DIR"

      - name: Enforce CI quality gates on smoke-test A/B report and InferenceEngine guards
        env:
          PYTHONPATH: expresat
          SMOKE_DIR: ${{ runner.temp }}/expresat_ci_smoke
        run: |
          python - <<'EOF'
          import json
          import os
          from pathlib import Path
          from models.inference_engine import IncompatibleFeatureSpecError, InferenceEngine

          smoke_dir = Path(os.environ["SMOKE_DIR"])
          report = json.loads((smoke_dir / "ablation_report.json").read_text(encoding="utf-8"))
          meta = json.loads((smoke_dir / "model_metadata.json").read_text(encoding="utf-8"))

          assert report["is_smoke_test"] is True
          assert report["production_ready"] is False
          assert meta["is_smoke_test"] is True
          assert meta["production_ready"] is False

          # Zero external .onnx.data sidecars
          sidecars = list(smoke_dir.rglob("*.onnx.data"))
          assert not sidecars, f"Forbidden .onnx.data sidecars found: {sidecars}"

          ds = report["models"]["ds_tcn"]
          assert ds["val_macro_f1"] >= 0.90, f"Smoke Macro-F1 gate failed: {ds['val_macro_f1']}"
          assert ds["quantization"]["quantized_pct"] >= 85.0, f"INT8 quantized_pct gate failed: {ds['quantization']['quantized_pct']}"
          assert ds["parity"]["fp32_logit_linf"] <= 1e-5, f"FP32 parity gate failed: {ds['parity']['fp32_logit_linf']}"
          assert ds["parity"]["int8_prob_linf"] <= 1e-2, f"INT8 parity gate failed: {ds['parity']['int8_prob_linf']}"
          assert ds["latency_cpu"]["p99_ms"] < 3.0, f"CPU latency p99 gate failed: {ds['latency_cpu']['p99_ms']}"
          assert ds["calibration"]["ece_after"] < 0.03, f"Calibration ECE gate failed: {ds['calibration']['ece_after']}"

          # Verify InferenceEngine refuses smoke-test artifact by default
          try:
              InferenceEngine(str(smoke_dir))
              raise AssertionError("InferenceEngine failed to block smoke-test model by default")
          except IncompatibleFeatureSpecError:
              pass

          # Verify InferenceEngine loads with explicit allow_smoke_test=True
          engine = InferenceEngine(str(smoke_dir), allow_smoke_test=True)
          info = engine.get_info()
          assert info["feature_spec_version"] == "1.4.0"
          assert info["production_ready"] is False
          print("[OK] All v1.4.0 CI smoke gates passed:", json.dumps(ds["quantization"]), json.dumps(ds["latency_cpu"]))
          EOF

  train-production-model:
    needs: verify-and-smoke-ablation
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.manifest_path != ''
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python ML dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install onnx onnxruntime numpy jsonschema

      - name: Train A/B ablation and export production model to expresat/models/exported_model
        env:
          PYTHONPATH: expresat
          MANIFEST_PATH: ${{ github.event.inputs.manifest_path }}
          EPOCHS: ${{ github.event.inputs.epochs || '40' }}
        run: |
          python expresat/models/train_and_export.py \
            --manifest "$MANIFEST_PATH" \
            --ablation \
            --epochs "$EPOCHS" \
            --benchmark-runs 200 \
            --output expresat/models/exported_model

      - name: Enforce production quality gates before artifact publication
        env:
          PYTHONPATH: expresat
          MIN_MACRO_F1: ${{ github.event.inputs.min_macro_f1 || '0.85' }}
        run: |
          python - <<'EOF'
          import json
          import os
          from pathlib import Path
          from models.inference_engine import InferenceEngine

          out_dir = Path("expresat/models/exported_model")
          meta = json.loads((out_dir / "model_metadata.json").read_text(encoding="utf-8"))
          min_f1 = float(os.environ["MIN_MACRO_F1"])

          assert meta["is_smoke_test"] is False, "Smoke artifacts forbidden in production directory"
          assert meta["production_ready"] is True, "production_ready must be true"
          assert not list(out_dir.glob("*.onnx.data")), "External .onnx.data sidecars are forbidden"
          assert meta["metrics"]["val_macro_f1"] >= min_f1, f"Val Macro-F1 below gate: {meta['metrics']['val_macro_f1']} < {min_f1}"
          assert meta["parity"]["fp32_logit_linf"] <= 1e-5, f"FP32 parity failed: {meta['parity']['fp32_logit_linf']}"
          assert meta["parity"]["int8_prob_linf"] <= 1e-2, f"INT8 parity failed: {meta['parity']['int8_prob_linf']}"
          assert meta["latency_cpu"]["p99_ms"] < 3.0, f"CPU latency p99 failed: {meta['latency_cpu']['p99_ms']}"
          assert meta["calibration"]["ece_after"] < 0.03, f"Calibration ECE failed: {meta['calibration']['ece_after']}"

          engine = InferenceEngine(str(out_dir))
          print("[OK] Production InferenceEngine gate verified:", json.dumps(engine.get_info(), indent=2))
          EOF

      - name: Upload canonical production model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: expresat-model-v140-${{ github.sha }}
          path: |
            expresat/models/exported_model/expresat_*_int8.onnx
            expresat/models/exported_model/model_metadata.json
            expresat/models/exported_model/ablation_report.json
          retention-days: 30
